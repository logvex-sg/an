# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Loom 1.18.x requires a Java 25 build JVM. The mod itself is compiled against the
# Java 21 toolchain below (the runtime required by Minecraft 1.21.11).
#
# Gradle auto-detects installed JDKs; no path is pinned here. If your JDK 21 is not
# found automatically, point Gradle at it (comma-separated list):
#   org.gradle.java.installations.paths=/path/to/jdk-21

# Mod identity
maven_group=com.logvex
archives_base_name=logvex-crystal
mod_version=1.0.0

# The Minecraft / mapping / Fabric-API / Java / Loom matrix is NOT set here. It lives in
# build-system/versions.json, generated from upstream metadata by
# `python3 build-system/generate_inventory.py`. Select a target with -PmcVersion=<x>;
# the default is inventory.primary (the fully-verified baseline, currently 1.21.11).
# See docs/phase9/ for the full compatibility matrix.
