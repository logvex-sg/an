# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Loom 1.18.x requires a Java 25 build JVM. The mod itself is compiled against the
# Java 21 toolchain below (the runtime required by Minecraft 1.21.11).
#
# Gradle auto-detects installed JDKs; no path is pinned here. If your JDK 21 is not
# found automatically, point Gradle at it (comma-separated list):
#   org.gradle.java.installations.paths=/path/to/jdk-21

# Mod identity
maven_group=com.logvex
archives_base_name=logvex-crystal
mod_version=1.0.0

# Toolchain / dependency matrix (Minecraft Java Edition 1.21.11, Fabric)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_version=0.141.6+1.21.11
loom_version=1.18.4

# Java runtime required by the 1.21.11 toolchain
java_version=21
