[versions]
# Test-tooling versions only. The Minecraft / mapping / Fabric-API / Loom matrix is read from
# build-system/versions.json at build time (see build.gradle), because it depends on the
# selected -PmcVersion and cannot be expressed as a static catalog.
junit = "5.11.4"
gson = "2.13.2"

[libraries]
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
